#!/usr/sbin/nft -f
# Panel firewall. Idempotent: own table, does NOT flush fail2ban's table.
#
# Открыто снаружи:
#   22          SSH (key-only)
#   80, 443     Caddy (сайт) + Xray Reality (fallback -> Caddy 127.0.0.1:8443)
#   21115-21119 RustDesk (remote management)
# Закрыто (только localhost): 22825 (3x-ui), 3000 (сайт напрямую), 8090.
# 2096 (legacy x-ui subscriptions) закрыт: подписки идут через сайт /sub/<code>.
add table inet vpnfilter
delete table inet vpnfilter
table inet vpnfilter {
    chain input {
        type filter hook input priority filter; policy accept;
        ct state established,related accept
        ct state invalid drop
        iif "lo" accept
        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept
        tcp dport 22 accept
        tcp dport { 80, 443 } accept
        udp dport 443 accept
        tcp dport 21115-21119 accept
        udp dport 21116 accept
        # everything else (22825 panel, 3000 site-direct, 8090, etc.) dropped
        drop
    }
}
